{% extends "layout.html" %}
{% set active = 'search' %}
{% block title %}Search — {{ APP_NAME }}{% endblock %}
{% block page_id %}search{% endblock %}

{% block content %}
<div class="search-hero">
  <h1>Search</h1>
  <div class="searchbox">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
      <circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 5 5" stroke-linecap="round"/>
    </svg>
    <input type="text" id="q" placeholder="Search by title…" autofocus autocomplete="off">
  </div>
  <div class="recent-chips" id="recent-searches"></div>
  <div class="search-status" id="search-status"></div>
</div>
<div class="cards" id="results"></div>
{% endblock %}
