{% extends "layout.html" %}
{% set active = 'discover' %}
{% block title %}Genres — {{ APP_NAME }}{% endblock %}
{% block page_id %}genres{% endblock %}

{% block content %}
<div class="page-head">
  <div>
    <div class="kicker">Browse</div>
    <h1>Genres</h1>
    <p class="sub">Pick a mood and explore your list by genre.</p>
  </div>
</div>

<div class="genre-grid">
  {% for g in genres %}
  <a class="genre-card" href="/list/all?genre={{ g|urlencode }}">
    <span>{{ g }}</span>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
  </a>
  {% endfor %}
</div>
{% endblock %}
